name: Frontend Continuos Integration

on:
  push:
    paths:
      - "frontend/**"

jobs:
  continuos-integration:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install
        working-directory: frontend

      - run: npm run build
        working-directory: frontend

      - run: npm run test
        working-directory: frontend