name: Backend .NET Continuous Integration

on:
  push:
    paths:
      - "backend/EventsSearcher/**"

  workflow_dispatch:

jobs:
  back-end-dot-net-continuous-integration:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend/EventsSearcher

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore